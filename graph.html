 const seed=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,2166136261), w=1200,h=720;
 data.nodes.forEach(n=>{const z=seed(n.id);n.x=100+(z%1000);n.y=70+((z>>>10)%580);n.vx=n.vy=0;});
 data.links.forEach(l=>{l.a=byId.get(l.source);l.b=byId.get(l.target);});
 function visibleNodes(){const q=document.getElementById('graph-search').value.trim().toLocaleLowerCase('fr');return data.nodes.filter(n=>active.has(n.type)&&(!q||n.label.toLocaleLowerCase('fr').includes(q)||n.domain.toLocaleLowerCase('fr').includes(q)));}
 function render(){const shown=visibleNodes(), ids=new Set(shown.map(n=>n.id)), shownLinks=data.links.filter(l=>ids.has(l.source)&&ids.has(l.target)), signature=shown.map(n=>n.id).join('|'); if(signature!==lastSignature){lastSignature=signature;nodeElements.clear();linkElements.clear();linksG.replaceChildren(...shownLinks.map(l=>{const e=document.createElementNS('http://www.w3.org/2000/svg','line');linkElements.set(l.source+'|'+l.target,e);return e;}));nodesG.replaceChildren(...shown.map(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('graph-node');g.dataset.id=n.id;g.setAttribute('tabindex','0');g.setAttribute('role','link');g.setAttribute('aria-label',n.label);const c=document.createElementNS(g.namespaceURI,'circle');c.setAttribute('r',n.type==='leçon'?9:n.type==='développement'?8:6);c.setAttribute('fill',colors[n.type]);const t=document.createElementNS(g.namespaceURI,'title');t.textContent=n.label;g.append(c,t);g.addEventListener('pointerdown',e=>{e.stopPropagation();drag=n;g.setPointerCapture(e.pointerId);});g.addEventListener('dblclick',()=>location.href=n.url);g.addEventListener('click',()=>select(n));g.addEventListener('keydown',e=>{if(e.key==='Enter')location.href=n.url;});nodeElements.set(n.id,g);return g;}));} shownLinks.forEach(l=>{const e=linkElements.get(l.source+'
'+l.target);e.setAttribute('x1',l.a.x);e.setAttribute('y1',l.a.y);e.setAttribute('x2',l.b.x);e.setAttribute('y2',l.b.y);});shown.forEach(n=>nodeElements.get(n.id).setAttribute('transform',`translate(${n.x} ${n.y})`));document.getElementById('graph-count').textContent=`${shown.length} nœuds · ${shownLinks.length} liens`;}
 function select(n){const neighbours=new Set();data.links.forEach(l=>{if(l.source===n.id)neighbours.add(l.target);if(l.target===n.id)neighbours.add(l.source);});document.querySelectorAll('.graph-node').forEach(e=>e.classList.toggle('is-neighbour',neighbours.has(e.dataset.id)||e.dataset.id===n.id));document.getElementById('graph-details').innerHTML=`<strong>${escapeHtml(n.label)}</strong><span>${escapeHtml(n.type)}${n.domain?' · '+escapeHtml(n.domain):''} · ${neighbours.size} voisin(s)</span><a href="${n.url}">Ouvrir la fiche →</a>`;}
 const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function tick(){const shown=visibleNodes(), ids=new Set(shown.map(n=>n.id));for(let step=0;step<3;step++){for(let i=0;i<shown.length;i++)for(let j=i+1;j<shown.length;j++){const a=shown[i],b=shown[j],dx=b.x-a.x||.1,dy=b.y-a.y||.1,d2=Math.max(225,dx*dx+dy*dy),f=Math.min(.008,1.5/d2);a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}data.links.forEach(l=>{if(!ids.has(l.source)||!ids.has(l.target))return;const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1,f=Math.max(-.45,Math.min(.45,(d-115)*.002));l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f;});shown.forEach(n=>{n.vx+=(w/2-n.x)*.0012;n.vy+=(h/2-n.y)*.0012;if(n!==drag){n.x=Math.max(35,Math.min(w-35,n.x+n.vx));n.y=Math.max(35,Math.min(h-35,n.y+n.vy));}n.vx*=.72;n.vy*=.72;});}render();requestAnimationFrame(tick);}
 function point(e){const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left-transform.x)/transform.k*w/r.width,y:(e.clientY-r.top-transform.y)/transform.k*h/r.height};}
 svg.addEventListener('pointermove',e=>{if(drag){const p=point(e);drag.x=p.x;drag.y=p.y;}else if(pan){transform.x=e.clientX-pan.x;transform.y=e.clientY-pan.y;applyTransform();}});svg.addEventListener('pointerup',()=>{drag=null;pan=null;});svg.addEventListener('pointerdown',e=>{if(e.target===svg)pan={x:e.clientX-transform.x,y:e.clientY-transform.y};});svg.addEventListener('wheel',e=>{e.preventDefault();transform.k=Math.max(.35,Math.min(3,transform.k*Math.exp(-e.deltaY*.001)));applyTransform();},{passive:false});
 function applyTransform(){viewport.setAttribute('transform',`translate(${transform.x*w/svg.clientWidth} ${transform.y*h/svg.clientHeight}) scale(${transform.k})`);}function reset(){transform={x:0,y:0,k:1};applyTransform();}
 document.querySelectorAll('.graph-legend button').forEach(b=>b.addEventListener('click',()=>{active.has(b.dataset.type)?active.delete(b.dataset.type):active.add(b.dataset.type);b.classList.toggle('is-active',active.has(b.dataset.type));}));document.getElementById('graph-search').addEventListener('input',render);document.getElementById('graph-reset').addEventListener('click',reset);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);render();tick();
})();
</script></body></html>
